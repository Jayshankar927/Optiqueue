version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: optiqueue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: optiqueue
      POSTGRES_PASSWORD: optiqueue_password
      POSTGRES_DB: optiqueue_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optiqueue -d optiqueue_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: optiqueue-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: optiqueue-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://optiqueue:optiqueue_password@postgres:5432/optiqueue_db
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - shared-uploads:/app/apps/api/uploads

volumes:
  pgdata:
  redisdata:
  shared-uploads: